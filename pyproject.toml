[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-intelligence-copilot"
version = "0.1.0"
description = "A production-style hybrid RAG portfolio project with citations and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Srilakshmi Dasari"}]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.38,<2",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
openai = ["openai>=1.50,<3"]

[project.scripts]
research-copilot = "research_copilot.cli:app"

[tool.setuptools.packages.find]
include = ["research_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.poetry]
package-mode = false
